# alembic.ini — Alembic configuration file for Tarang
# Run `alembic upgrade head` to apply all migrations.

[alembic]
# Path to the migrations directory (relative to this file)
script_location = alembic

# Disable configparser %-interpolation so that DATABASE_URLs containing
# percent-encoded characters (e.g. %40 for @) or $$ do not crash.
# env.py reads the URL directly from pydantic-settings instead of alembic.ini.
interpolation = off

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering dates. Defaults to UTC.
# timezone = UTC


# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# The database URL is read from the environment via env.py.
# Do NOT hard-code credentials here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
