<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <style>
        body {
            font-family: 'Outfit', 'Inter', Helvetica, Arial, sans-serif;
            background-color: #F8FBFD;
            color: #0F4C81;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.1);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 24px;
            color: #0F4C81;
        }
        .logo span {
            color: #14B8A6;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: #0F4C81;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #4A5568;
            text-align: center;
            margin-bottom: 24px;
        }
        .btn-container {
            text-align: center;
            margin: 32px 0;
        }
        .btn {
            background-color: #14B8A6;
            color: #ffffff !important;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 8px 15px rgba(20, 184, 166, 0.25);
            display: inline-block;
        }
        .link-container {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #E2E8F0;
            word-break: break-all;
            font-size: 13px;
            color: #A0AEC0;
            text-align: center;
        }
        .link-container a {
            color: #14B8A6;
            text-decoration: none;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #A0AEC0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌊 Tar<span>ang</span></div>
        {% block content %}{% endblock %}
        <div class="footer">
            &copy; {{ current_year }} {{ app_name }}. All rights reserved.<br>
            Connecting people through community currents.
        </div>
    </div>
</body>
</html>
