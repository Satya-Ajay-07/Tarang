name: mobile
description: "Tarang Official Flutter Mobile Application."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  go_router: ^13.0.1
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
