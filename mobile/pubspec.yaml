  intl: ^0.19.0
  logger: ^2.2.0
  equatable: ^2.0.6
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  shimmer: ^3.0.0
  permission_handler: ^11.3.0
  flutter_native_splash: ^2.3.8
  package_info_plus: ^5.0.1
  share_plus: ^7.2.1

dev_dependencies:
